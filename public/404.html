<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>404 - Pagina niet gevonden</title>
    <style>
      :root {
        color: #111827;
        background: #f3f4f6;
        font-family: Arial, sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
      }

      body {
        display: grid;
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(100% - 32px, 520px);
        box-sizing: border-box;
        padding: 40px 32px;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        background: #fff;
        text-align: center;
      }

      p {
        color: #6b7280;
        line-height: 1.6;
      }

      a {
        display: inline-block;
        margin-top: 12px;
        color: #2457c5;
        font-weight: 600;
        text-underline-offset: 3px;
      }

      a:focus-visible {
        outline: 3px solid #2457c5;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404 - Pagina niet gevonden</h1>
      <p>Deze pagina bestaat niet of is niet beschikbaar.</p>
      <a href="/">Terug naar de startpagina</a>
    </main>
  </body>
</html>
